<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Pinkerton-Detektei: ovale Messingplakette mit dem wachsamen Auge -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d991"/>
      <stop offset=".4" stop-color="#b8904a"/>
      <stop offset=".7" stop-color="#7a5620"/>
      <stop offset="1" stop-color="#d7b56c"/>
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#3a2e22"/>
      <stop offset="1" stop-color="#1c150e"/>
    </radialGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8fb0c4"/>
      <stop offset=".6" stop-color="#3c5a6e"/>
      <stop offset="1" stop-color="#1b2a35"/>
    </radialGradient>
    <filter id="wear" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="12"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.17  0 0 0 0 0.06  0 0 0 0.35 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="200" rx="160" ry="182" fill="url(#g)" stroke="#3a2410" stroke-width="5"/>
  <ellipse cx="200" cy="200" rx="160" ry="182" fill="#b8904a" filter="url(#wear)"/>
  <ellipse cx="200" cy="200" rx="138" ry="158" fill="url(#face)" stroke="#6e4e1c" stroke-width="4"/>
  <!-- Strahlen -->
  <g stroke="#b8904a" stroke-width="3" opacity=".55" stroke-linecap="round">
    <line x1="200" y1="62" x2="200" y2="100"/><line x1="138" y1="80" x2="152" y2="112"/><line x1="262" y1="80" x2="248" y2="112"/>
    <line x1="92" y1="118" x2="116" y2="138"/><line x1="308" y1="118" x2="284" y2="138"/>
    <line x1="200" y1="338" x2="200" y2="300"/><line x1="138" y1="320" x2="152" y2="288"/><line x1="262" y1="320" x2="248" y2="288"/>
  </g>
  <!-- Auge -->
  <path d="M82 200 Q200 96 318 200 Q200 304 82 200 Z" fill="#efe6d2" stroke="#d7b56c" stroke-width="6"/>
  <circle cx="200" cy="200" r="54" fill="url(#iris)" stroke="#1b2a35" stroke-width="3"/>
  <circle cx="200" cy="200" r="24" fill="#0c0a08"/>
  <circle cx="186" cy="186" r="9" fill="#fff" opacity=".85"/>
  <!-- Wimpern / Lid -->
  <path d="M82 200 Q200 96 318 200" fill="none" stroke="#3a2410" stroke-width="7"/>
  <g stroke="#d7b56c" stroke-width="4" stroke-linecap="round">
    <line x1="110" y1="170" x2="96" y2="150"/><line x1="140" y1="148" x2="132" y2="124"/>
    <line x1="200" y1="137" x2="200" y2="112"/><line x1="260" y1="148" x2="268" y2="124"/><line x1="290" y1="170" x2="304" y2="150"/>
  </g>
  <path d="M90 90 Q130 45 190 38" stroke="#fff3cf" stroke-width="5" fill="none" opacity=".45" stroke-linecap="round"/>
</svg>
