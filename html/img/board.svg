<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Steckbriefbrett: Bretter mit Naegeln, Rahmen, Kopfschild, Reste alter Aushaenge.
       Plakate und Notizzettel liegen als HTML darueber. -->
  <defs>
    <filter id="woodH" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.3 0.012" numOctaves="4" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.06  0 0 0 0 0.02  0 0 0 0.7 -0.12"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="woodV" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.3" numOctaves="4" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.04  0 0 0 0 0.01  0 0 0 0.75 -0.1"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="torn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="13" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="22"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="nail" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d9d3c8"/>
      <stop offset=".55" stop-color="#6f675d"/>
      <stop offset="1" stop-color="#2a2622"/>
    </radialGradient>
    <linearGradient id="vign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset=".15" stop-color="#000" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <g id="nails">
      <circle cx="0" cy="0" r="6" fill="url(#nail)"/>
    </g>
  </defs>

  <!-- Rahmen -->
  <rect x="0" y="0" width="1600" height="1000" rx="12" fill="#3a2212"/>
  <rect x="0" y="0" width="1600" height="1000" rx="12" fill="#3a2212" filter="url(#woodV)"/>

  <!-- Bretter -->
  <g>
    <rect x="40" y="40"  width="1520" height="116" fill="#7a5534"/>
    <rect x="40" y="156" width="1520" height="114" fill="#6d4a2c"/>
    <rect x="40" y="270" width="1520" height="116" fill="#775232"/>
    <rect x="40" y="386" width="1520" height="112" fill="#6a472a"/>
    <rect x="40" y="498" width="1520" height="116" fill="#7b5636"/>
    <rect x="40" y="614" width="1520" height="114" fill="#6e4b2d"/>
    <rect x="40" y="728" width="1520" height="116" fill="#765131"/>
    <rect x="40" y="844" width="1520" height="116" fill="#6b482b"/>
  </g>
  <rect x="40" y="40" width="1520" height="920" fill="#6f4c2e" filter="url(#woodH)"/>
  <g stroke="#2a170a" stroke-width="3" opacity=".75">
    <line x1="40" y1="156" x2="1560" y2="156"/><line x1="40" y1="270" x2="1560" y2="270"/>
    <line x1="40" y1="386" x2="1560" y2="386"/><line x1="40" y1="498" x2="1560" y2="498"/>
    <line x1="40" y1="614" x2="1560" y2="614"/><line x1="40" y1="728" x2="1560" y2="728"/>
    <line x1="40" y1="844" x2="1560" y2="844"/>
  </g>
  <rect x="40" y="40" width="1520" height="920" fill="url(#vign)"/>
  <!-- Innenkante des Rahmens -->
  <rect x="40" y="40" width="1520" height="920" fill="none" stroke="#1d0f06" stroke-width="5"/>
  <g stroke="#1d0f06" stroke-width="3" opacity=".8">
    <line x1="0" y1="0" x2="40" y2="40"/><line x1="1600" y1="0" x2="1560" y2="40"/>
    <line x1="0" y1="1000" x2="40" y2="960"/><line x1="1600" y1="1000" x2="1560" y2="960"/>
  </g>

  <!-- Naegel an den Brettenden -->
  <g>
    <use href="#nails" x="62" y="98"/><use href="#nails" x="1538" y="98"/>
    <use href="#nails" x="62" y="213"/><use href="#nails" x="1538" y="213"/>
    <use href="#nails" x="62" y="328"/><use href="#nails" x="1538" y="328"/>
    <use href="#nails" x="62" y="442"/><use href="#nails" x="1538" y="442"/>
    <use href="#nails" x="62" y="556"/><use href="#nails" x="1538" y="556"/>
    <use href="#nails" x="62" y="671"/><use href="#nails" x="1538" y="671"/>
    <use href="#nails" x="62" y="786"/><use href="#nails" x="1538" y="786"/>
    <use href="#nails" x="62" y="902"/><use href="#nails" x="1538" y="902"/>
  </g>

  <!-- Reste alter Aushaenge -->
  <g filter="url(#torn)" opacity=".42">
    <rect x="120" y="150" width="190" height="130" fill="#d9c49a" transform="rotate(-6 215 215)"/>
    <rect x="690" y="560" width="160" height="220" fill="#cdb78d" transform="rotate(5 770 670)"/>
    <rect x="360" y="780" width="230" height="120" fill="#d4bf95" transform="rotate(-3 475 840)"/>
    <rect x="1100" y="820" width="140" height="100" fill="#d9c49a" transform="rotate(8 1170 870)"/>
  </g>
  <g fill="#3a2410" opacity=".5">
    <circle cx="214" cy="160" r="4"/><circle cx="772" cy="568" r="4"/><circle cx="470" cy="786" r="4"/>
  </g>

  <!-- Kopfschild -->
  <rect x="518" y="30" width="576" height="84" rx="6" fill="#000" opacity=".55" filter="url(#shadow)"/>
  <rect x="512" y="20" width="576" height="84" rx="6" fill="#c9a870"/>
  <rect x="512" y="20" width="576" height="84" rx="6" fill="#b89560" filter="url(#woodH)"/>
  <rect x="512" y="20" width="576" height="84" rx="6" fill="none" stroke="#2a170a" stroke-width="4"/>
  <rect x="524" y="30" width="552" height="64" rx="4" fill="none" stroke="#2a170a" stroke-width="1.5" opacity=".6"/>
  <use href="#nails" x="534" y="62"/><use href="#nails" x="1066" y="62"/>
</svg>
