<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- US Marshal: fuenfzackiger Stern im Kreis (Nickel/Silber) -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbf6"/>
      <stop offset=".3" stop-color="#c9c7bf"/>
      <stop offset=".55" stop-color="#83807a"/>
      <stop offset=".8" stop-color="#e0dfd8"/>
      <stop offset="1" stop-color="#6b6862"/>
    </linearGradient>
    <linearGradient id="s2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f0ea"/>
      <stop offset=".5" stop-color="#a9a69e"/>
      <stop offset="1" stop-color="#5c5953"/>
    </linearGradient>
    <filter id="wear" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0.3 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <mask id="ring">
      <rect width="400" height="400" fill="#fff"/>
      <circle cx="200" cy="200" r="130" fill="#000"/>
    </mask>
  </defs>
  <!-- Ring -->
  <circle cx="200" cy="200" r="176" fill="url(#s)" stroke="#3a3632" stroke-width="4" mask="url(#ring)"/>
  <circle cx="200" cy="200" r="176" fill="#9a978f" filter="url(#wear)" mask="url(#ring)"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#3a3632" stroke-width="4"/>
  <circle cx="200" cy="200" r="163" fill="none" stroke="#5c5953" stroke-width="2"/>
  <circle cx="200" cy="200" r="143" fill="none" stroke="#5c5953" stroke-width="2"/>
  <!-- Punkte im Ring -->
  <g fill="#4a4741">
    <circle cx="200" cy="47" r="5"/><circle cx="353" cy="200" r="5"/><circle cx="200" cy="353" r="5"/><circle cx="47" cy="200" r="5"/>
    <circle cx="308" cy="92" r="4"/><circle cx="308" cy="308" r="4"/><circle cx="92" cy="308" r="4"/><circle cx="92" cy="92" r="4"/>
  </g>
  <!-- Stern -->
  <path d="M200 72 L230.1 158.6 L321.8 160.5 L248.6 215.8 L275.2 303.5 L200 251.2 L124.8 303.5 L151.4 215.8 L78.2 160.5 L169.9 158.6 Z"
        fill="url(#s2)" stroke="#3a3632" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#5c5953" stroke-width="2" opacity=".55">
    <line x1="200" y1="84" x2="200" y2="200"/><line x1="310" y1="163" x2="200" y2="200"/>
    <line x1="268" y1="293" x2="200" y2="200"/><line x1="132" y1="293" x2="200" y2="200"/>
    <line x1="90" y1="163" x2="200" y2="200"/>
  </g>
  <circle cx="200" cy="200" r="26" fill="url(#s)" stroke="#3a3632" stroke-width="3"/>
  <path d="M120 100 Q160 72 205 78" stroke="#ffffff" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>
</svg>
