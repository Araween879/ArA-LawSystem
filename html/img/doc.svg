<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300">
  <!-- Amtliches Schreiben (Bussgeldbescheid, Haftbefehl, Bericht, Beweis). Keine Texte. -->
  <defs>
    <filter id="edge" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.40  0 0 0 0 0.27  0 0 0 0 0.14  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="14"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.50  0 0 0 0 0.33  0 0 0 0 0.14  0 0 0 0.7 -0.28"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="age" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#efe2c0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8a6236" stop-opacity=".45"/>
    </radialGradient>
    <g id="corner" fill="none" stroke="#2b1d12" stroke-width="3">
      <path d="M0 70 C0 30 30 0 70 0"/>
      <path d="M14 70 C14 38 38 14 70 14" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="9" fill="#2b1d12" stroke="none"/>
      <path d="M44 30 C60 30 64 18 80 18 M30 44 C30 60 18 64 18 80" stroke-width="2"/>
    </g>
  </defs>
  <g filter="url(#edge)">
    <rect x="22" y="20" width="956" height="1260" fill="#efe2c0"/>
    <rect x="22" y="20" width="956" height="1260" fill="#efe2c0" filter="url(#stain)"/>
    <rect x="22" y="20" width="956" height="1260" fill="url(#age)"/>
    <rect x="22" y="20" width="956" height="1260" fill="#efe2c0" filter="url(#grain)"/>
  </g>
  <!-- Doppelrahmen -->
  <rect x="60" y="56" width="880" height="1188" fill="none" stroke="#2b1d12" stroke-width="4" opacity=".75"/>
  <rect x="74" y="70" width="852" height="1160" fill="none" stroke="#2b1d12" stroke-width="1.4" opacity=".6"/>
  <g opacity=".7">
    <use href="#corner" transform="translate(82 78)"/>
    <use href="#corner" transform="translate(918 78) scale(-1 1)"/>
    <use href="#corner" transform="translate(82 1222) scale(1 -1)"/>
    <use href="#corner" transform="translate(918 1222) scale(-1 -1)"/>
  </g>
  <!-- Linie unter dem Kopf, Linie ueber dem Fuss -->
  <g stroke="#2b1d12" opacity=".55">
    <line x1="150" y1="232" x2="850" y2="232" stroke-width="2.5"/>
    <line x1="190" y1="240" x2="810" y2="240" stroke-width="1"/>
    <line x1="150" y1="1000" x2="850" y2="1000" stroke-width="1"/>
  </g>
  <!-- Wasserzeichen: Stern im Kreis -->
  <g opacity=".055" fill="#2b1d12" transform="translate(500 620)">
    <circle r="230" fill="none" stroke="#2b1d12" stroke-width="18"/>
    <path d="M0 -200 L47 -65 L190 -62 L76 25 L118 162 L0 81 L-118 162 L-76 25 L-190 -62 L-47 -65 Z"/>
  </g>
</svg>
