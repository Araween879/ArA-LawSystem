  <circle cx="200" cy="190" r="52" fill="none" stroke="#6e4e1c" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M200 145 L210.6 175.4 L242.8 176.1 L217.1 195.6 L226.4 226.4 L200 208 L173.6 226.4 L182.9 195.6 L157.2 176.1 L189.4 175.4 Z"
