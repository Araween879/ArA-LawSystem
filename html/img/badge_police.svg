      <stop offset="0" stop-color="#f7f6f0"/>
      <stop offset=".35" stop-color="#bdbab2"/>
      <stop offset=".6" stop-color="#7b7872"/>
      <stop offset=".85" stop-color="#dcdad2"/>
      <stop offset="1" stop-color="#5f5c56"/>
    </linearGradient>
