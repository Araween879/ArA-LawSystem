<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1250" viewBox="0 0 900 1250">
  <!-- WANTED-Plakat: vergilbtes Papier, ausgefranste Kanten, Rahmen. Keine Texte (kommen aus der NUI). -->
  <defs>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="21"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.26 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.28  0 0 0 0 0.10  0 0 0 0.9 -0.35"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="burn" cx="50%" cy="48%" r="72%">
      <stop offset="55%" stop-color="#e3cfa0" stop-opacity="0"/>
      <stop offset="88%" stop-color="#8a5a2a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4a2c12" stop-opacity=".85"/>
    </radialGradient>
  </defs>
  <g filter="url(#edge)">
    <rect x="28" y="30" width="844" height="1190" fill="#e3cfa0"/>
    <rect x="28" y="30" width="844" height="1190" fill="#e3cfa0" filter="url(#stain)"/>
    <rect x="28" y="30" width="844" height="1190" fill="url(#burn)"/>
    <rect x="28" y="30" width="844" height="1190" fill="#e3cfa0" filter="url(#grain)"/>
  </g>
  <!-- Rahmenlinien -->
  <rect x="64" y="66" width="772" height="1118" fill="none" stroke="#2b1d12" stroke-width="7" opacity=".82"/>
  <rect x="78" y="80" width="744" height="1090" fill="none" stroke="#2b1d12" stroke-width="2" opacity=".7"/>
  <!-- Eck-Ornamente -->
  <g fill="#2b1d12" opacity=".78">
    <path d="M78 80 l34 0 l-34 34 z"/>
    <path d="M822 80 l-34 0 l34 34 z"/>
    <path d="M78 1170 l34 0 l-34 -34 z"/>
    <path d="M822 1170 l-34 0 l34 -34 z"/>
  </g>
  <!-- Nagelloch -->
  <circle cx="450" cy="52" r="7" fill="#3a2410" opacity=".7"/>
  <path d="M440 44 q10 -4 20 0" stroke="#6b4a2b" stroke-width="2" fill="none" opacity=".6"/>
</svg>
