<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Gericht: Goldmedaille mit Lorbeer und Waage -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a6"/>
      <stop offset=".35" stop-color="#d5ad5c"/>
      <stop offset=".65" stop-color="#8e6a2c"/>
      <stop offset="1" stop-color="#e2c27a"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#7a2a22"/>
      <stop offset="1" stop-color="#3e0f0b"/>
    </radialGradient>
    <filter id="wear" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.17  0 0 0 0 0.06  0 0 0 0.3 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <path id="leaf" d="M0 0 Q9 -10 0 -24 Q-9 -10 0 0 Z"/>
  </defs>
  <circle cx="200" cy="200" r="178" fill="url(#g)" stroke="#4a3312" stroke-width="5"/>
  <circle cx="200" cy="200" r="178" fill="#b8904a" filter="url(#wear)"/>
  <!-- Lorbeerkranz -->
  <g fill="#7a5a1e" opacity=".85">
    <use href="#leaf" transform="translate(200 200) rotate(200) translate(0 -152) rotate(-20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(215) translate(0 -152) rotate(-20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(230) translate(0 -152) rotate(-20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(245) translate(0 -152) rotate(-20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(260) translate(0 -152) rotate(-20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(275) translate(0 -152) rotate(-20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(290) translate(0 -152) rotate(-20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(305) translate(0 -152) rotate(-20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(160) translate(0 -152) rotate(20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(145) translate(0 -152) rotate(20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(130) translate(0 -152) rotate(20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(115) translate(0 -152) rotate(20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(100) translate(0 -152) rotate(20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(85) translate(0 -152) rotate(20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(70) translate(0 -152) rotate(20)"/>
    <use href="#leaf" transform="translate(200 200) rotate(55) translate(0 -152) rotate(20)"/>
  </g>
  <circle cx="200" cy="200" r="126" fill="url(#field)" stroke="#4a3312" stroke-width="5"/>
  <circle cx="200" cy="200" r="116" fill="none" stroke="#d5ad5c" stroke-width="2" stroke-dasharray="3 6"/>
  <!-- Waage -->
  <g fill="none" stroke="#f0d28c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="200" y1="112" x2="200" y2="286"/>
    <line x1="116" y1="140" x2="284" y2="140"/>
    <path d="M168 292 L232 292 L220 276 L180 276 Z" fill="#f0d28c"/>
    <line x1="116" y1="140" x2="94" y2="210"/><line x1="116" y1="140" x2="138" y2="210"/>
    <line x1="284" y1="140" x2="262" y2="210"/><line x1="284" y1="140" x2="306" y2="210"/>
    <path d="M86 210 Q116 246 146 210 Z" fill="#f0d28c"/>
    <path d="M254 210 Q284 246 314 210 Z" fill="#f0d28c"/>
  </g>
  <circle cx="200" cy="106" r="11" fill="#f0d28c" stroke="#4a3312" stroke-width="2"/>
  <path d="M92 110 Q130 60 192 50" stroke="#fff6d8" stroke-width="5" fill="none" opacity=".45" stroke-linecap="round"/>
</svg>
