<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Sisika-Gefaengnis: Eisenplakette mit Gitter und Schluessel, Bronzerand -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2b77a"/>
      <stop offset=".45" stop-color="#9a6a32"/>
      <stop offset=".75" stop-color="#5e3d18"/>
      <stop offset="1" stop-color="#c79a5c"/>
    </linearGradient>
    <radialGradient id="iron" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#7a766f"/>
      <stop offset=".7" stop-color="#46423d"/>
      <stop offset="1" stop-color="#2a2724"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2724"/>
      <stop offset=".5" stop-color="#9c978f"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <clipPath id="inner"><circle cx="200" cy="200" r="122"/></clipPath>
    <filter id="rust" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="3" seed="6"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.22  0 0 0 0 0.08  0 0 0 0.9 -0.45"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="176" fill="url(#bronze)" stroke="#2a1a0c" stroke-width="5"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#5e3d18" stroke-width="3"/>
  <g fill="#3a2410">
    <circle cx="200" cy="38" r="6"/><circle cx="362" cy="200" r="6"/><circle cx="200" cy="362" r="6"/><circle cx="38" cy="200" r="6"/>
  </g>
  <circle cx="200" cy="200" r="126" fill="url(#iron)" stroke="#1a1714" stroke-width="5"/>
  <circle cx="200" cy="200" r="126" fill="#46423d" filter="url(#rust)"/>
  <!-- Gitter -->
  <g clip-path="url(#inner)">
    <rect x="128" y="60" width="14" height="290" fill="url(#bar)"/>
    <rect x="164" y="60" width="14" height="290" fill="url(#bar)"/>
    <rect x="200" y="60" width="14" height="290" fill="url(#bar)" transform="translate(-7 0)"/>
    <rect x="222" y="60" width="14" height="290" fill="url(#bar)"/>
    <rect x="258" y="60" width="14" height="290" fill="url(#bar)"/>
    <rect x="60" y="120" width="290" height="12" fill="#5c5852"/>
    <rect x="60" y="268" width="290" height="12" fill="#5c5852"/>
  </g>
  <!-- Schluessel -->
  <g transform="rotate(-40 200 200)">
    <circle cx="200" cy="112" r="30" fill="none" stroke="#d7a860" stroke-width="12"/>
    <rect x="193" y="140" width="14" height="150" rx="4" fill="#d7a860" stroke="#5e3d18" stroke-width="2"/>
    <rect x="207" y="250" width="28" height="12" fill="#d7a860" stroke="#5e3d18" stroke-width="2"/>
    <rect x="207" y="272" width="20" height="12" fill="#d7a860" stroke="#5e3d18" stroke-width="2"/>
  </g>
  <path d="M90 100 Q130 55 190 46" stroke="#fff0d0" stroke-width="5" fill="none" opacity=".4" stroke-linecap="round"/>
</svg>
