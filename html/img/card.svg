<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <!-- Lizenz / Waffenschein: Karton mit Guilloche-Rand. Keine Texte. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="31"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.26  0 0 0 0 0.14  0 0 0 0.16 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.007" numOctaves="3" seed="6"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.48  0 0 0 0 0.32  0 0 0 0 0.14  0 0 0 0.6 -0.25"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="age" cx="50%" cy="50%" r="72%">
      <stop offset="62%" stop-color="#eadbb4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7d5630" stop-opacity=".5"/>
    </radialGradient>
    <pattern id="guil" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="11" fill="none" stroke="#6b4a2b" stroke-width="1.2" opacity=".55"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#6b4a2b" stroke-width="1.2" opacity=".55"/>
      <circle cx="28" cy="0" r="11" fill="none" stroke="#6b4a2b" stroke-width="1.2" opacity=".55"/>
      <circle cx="0" cy="28" r="11" fill="none" stroke="#6b4a2b" stroke-width="1.2" opacity=".55"/>
      <circle cx="28" cy="28" r="11" fill="none" stroke="#6b4a2b" stroke-width="1.2" opacity=".55"/>
    </pattern>
    <mask id="band">
      <rect width="1400" height="900" fill="#fff"/>
      <rect x="66" y="66" width="1268" height="768" rx="18" fill="#000"/>
    </mask>
  </defs>
  <rect x="16" y="16" width="1368" height="868" rx="34" fill="#eadbb4"/>
  <rect x="16" y="16" width="1368" height="868" rx="34" fill="#eadbb4" filter="url(#stain)"/>
  <rect x="16" y="16" width="1368" height="868" rx="34" fill="url(#age)"/>
  <rect x="16" y="16" width="1368" height="868" rx="34" fill="#eadbb4" filter="url(#grain)"/>
  <!-- Guilloche-Band -->
  <rect x="36" y="36" width="1328" height="828" rx="24" fill="url(#guil)" mask="url(#band)"/>
  <rect x="36" y="36" width="1328" height="828" rx="24" fill="none" stroke="#2b1d12" stroke-width="4" opacity=".75"/>
  <rect x="66" y="66" width="1268" height="768" rx="18" fill="none" stroke="#2b1d12" stroke-width="2" opacity=".65"/>
  <!-- Trennlinie Siegel-Spalte / Text -->
  <line x1="330" y1="100" x2="330" y2="660" stroke="#2b1d12" stroke-width="1.5" opacity=".35"/>
  <line x1="350" y1="270" x2="1330" y2="270" stroke="#2b1d12" stroke-width="1.5" opacity=".4"/>
  <line x1="100" y1="680" x2="1300" y2="680" stroke="#2b1d12" stroke-width="1" opacity=".35"/>
</svg>
